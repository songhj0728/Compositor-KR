name: Verify

on:
  push:
  pull_request:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: unit
    # Push covers same-repo branches. pull_request runs only for forks, so a PR is not tested twice.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Test portable core rules
        run: |
          swiftc Compositor/Core/BevelGeometry.swift Compositor/Core/LayerLockRules.swift Compositor/Core/VectorPath.swift Tests/PortableCore/main.swift -o "$RUNNER_TEMP/compositor-core-tests"
          "$RUNNER_TEMP/compositor-core-tests"
          cc -std=c11 -O2 -Wall -Wextra -Werror Compositor/Core/StylePixels.c Tests/PortableCore/style_pixels.c -lm -o "$RUNNER_TEMP/compositor-style-tests"
          "$RUNNER_TEMP/compositor-style-tests"

      - name: Resolve Swift packages
        run: >
          xcodebuild -resolvePackageDependencies
          -project Compositor-KR.xcodeproj
          -scheme Compositor
          -onlyUsePackageVersionsFromResolvedFile

      - name: Build for testing
        id: build
        run: >
          xcodebuild build-for-testing
          -project Compositor-KR.xcodeproj
          -scheme Compositor
          -destination 'platform=macOS,arch=arm64'
          -configuration Debug
          -derivedDataPath DerivedData
          CODE_SIGN_IDENTITY=-

      # Window and asynchronous preview tests need the main actor to service callbacks.
      # Run them after the CPU-heavy suites so parallel load cannot exhaust their deadlines.
      - name: Run unit tests in parallel
        run: >
          xcodebuild test-without-building
          -project Compositor-KR.xcodeproj
          -scheme Compositor
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath DerivedData
          -resultBundlePath ParallelResults.xcresult
          -parallel-testing-enabled YES
          -skip-testing:CompositorTests/FloatingPanelTests
          -skip-testing:CompositorTests/SliderSnapTests
          -skip-testing:CompositorTests/LayerStyleTests

      - name: Run window and preview tests serially
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: >
          xcodebuild test-without-building
          -project Compositor-KR.xcodeproj
          -scheme Compositor
          -destination 'platform=macOS,arch=arm64'
          -derivedDataPath DerivedData
          -resultBundlePath SerialResults.xcresult
          -parallel-testing-enabled NO
          -only-testing:CompositorTests/FloatingPanelTests
          -only-testing:CompositorTests/SliderSnapTests
          -only-testing:CompositorTests/LayerStyleTests

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: '*.xcresult'
          retention-days: 7
          if-no-files-found: ignore
