name: Spike — Core model

# Builds and tests the document-model spike (Spikes/CoreModel) on Windows and macOS: the Swift Core, the C++ Core,
# the host program against both, and Swift using the C++ Core. Only runs when the spike changes.

on:
  push:
    paths: ['Spikes/CoreModel/**', '.github/workflows/spike-core-model.yml']
  pull_request:
    paths: ['Spikes/CoreModel/**', '.github/workflows/spike-core-model.yml']
  workflow_dispatch:

concurrency:
  group: spike-core-model-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Spikes/CoreModel
    steps:
      - uses: actions/checkout@v7

      - name: Cores use no platform, UI or GPU framework
        shell: bash
        run: ./check-core-boundaries.sh

      - name: Install Swift
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.4.0-release
          swift-build: 6.4.0-RELEASE

      - name: Swift Core — build and test
        run: swift test --package-path swift

      - name: Swift calls Windows APIs
        run: swift run --package-path swift WindowsAPIDemo

      - name: Swift Core as a DLL
        run: swift build --package-path swift -c release --product CompositorCore

      - name: C++ Core and the host against both Cores
        shell: pwsh
        run: |
          $swiftCore = (swift build --package-path swift -c release --show-bin-path)
          cmake -S . -B ../../build/spike "-DSWIFT_CORE_DIR=$swiftCore"
          cmake --build ../../build/spike --config Release
          # The Swift runtime DLLs come from the toolchain on PATH.
          ctest --test-dir ../../build/spike --build-config Release --output-on-failure

      # C#, as a WinUI 3 app would call the Cores. csc.exe ships with Windows (.NET Framework); nothing to install.
      # Failures are reported as annotations (::error::), which show without signing in to read the log.
      - name: C# host against both Cores
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $bin = (Resolve-Path ../../build/spike/bin/Release).Path
          # Full Windows paths: csc 4.x misreads relative paths written with forward slashes.
          $sources = 'CompositorCore.cs', 'HostTests.cs' | ForEach-Object { (Resolve-Path (Join-Path hosts (Join-Path csharp $_))).Path }
          $dlls = (Get-ChildItem $bin -Filter *.dll | ForEach-Object Name) -join ', '
          Write-Output "::notice title=C# host::DLLs next to the host: $dlls"
          $failed = $false
          foreach ($core in 'swift', 'cpp') {
            $define = if ($core -eq 'cpp') { '-define:CPP_CORE' } else { '-define:SWIFT_CORE' }
            $exe = Join-Path $bin "host_cs_$core.exe"
            $out = & $csc -nologo -platform:x64 -codepage:65001 $define "-out:$exe" $sources 2>&1 | Out-String
            if ($LASTEXITCODE) { Write-Output "::error title=csc ($core)::$($out -replace "`r?`n", '%0A')"; $failed = $true; continue }
            $out = & $exe 2>&1 | Out-String
            $code = $LASTEXITCODE
            Write-Output $out
            if ($code) { Write-Output "::error title=C# host on the $core Core (exit $code)::$($out -replace "`r?`n", '%0A')"; $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # A WinUI 3 window (Windows App SDK 2.5.1, stable) on each Core: builds hosts/winui, runs its self-test, and
      # reports every line as an annotation. The Swift runtime and VC++ runtime are copied next to the app.
      - name: WinUI 3 window against both Cores
        shell: pwsh
        run: |
          $swiftCore = (swift build --package-path swift -c release --show-bin-path)
          $cppCore = (Resolve-Path ../../build/spike/bin/Release).Path
          $swiftRuntime = Split-Path (where.exe swiftCore.dll | Select-Object -First 1)
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $vcRuntime = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT" -Directory | Select-Object -Last 1
          Write-Output "::notice title=WinUI build::Swift runtime $swiftRuntime; VC++ runtime $vcRuntime"
          $failed = $false
          foreach ($core in 'Swift', 'Cpp') {
            $dir = if ($core -eq 'Swift') { $swiftCore } else { $cppCore }
            $out = dotnet build hosts/winui/CoreModelWinUI.csproj -c Release "-p:Core=$core" "-p:CoreDllDir=$dir" "-p:SwiftRuntimeDir=$swiftRuntime" 2>&1 | Out-String
            if ($LASTEXITCODE) { Write-Output "::error title=WinUI build ($core)::$($out -replace "`r?`n", '%0A')"; $failed = $true; continue }
            $bin = (Resolve-Path "hosts/winui/bin/$core/Release").Path
            Copy-Item "$vcRuntime\vcruntime140.dll", "$vcRuntime\vcruntime140_1.dll", "$vcRuntime\msvcp140.dll" $bin
            $results = Join-Path $env:RUNNER_TEMP "winui-$core"
            $process = Start-Process -FilePath "$bin\CoreModelWinUI.exe" -ArgumentList 'selftest', $results -PassThru
            if (-not $process.WaitForExit(180000)) { $process.Kill(); Write-Output "::error title=WinUI self-test ($core)::timed out"; $failed = $true; continue }
            $report = if (Test-Path "$results\selftest.txt") { Get-Content "$results\selftest.txt" -Encoding UTF8 } else { @('no selftest.txt') }
            $report | Write-Output
            $level = if ($process.ExitCode -eq 0) { 'notice' } else { 'error' }
            Write-Output "::$level title=WinUI self-test on the $core Core (exit $($process.ExitCode))::$($report -join '%0A')"
            if ($process.ExitCode -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Swift uses the C++ Core
        run: swift test --package-path cpp

  macos:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Spikes/CoreModel
    steps:
      - uses: actions/checkout@v7

      - name: Cores use no platform, UI or GPU framework
        shell: bash
        run: ./check-core-boundaries.sh

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Swift Core — SwiftPM
        run: swift test --package-path swift

      # The same package through Xcode's build system, as the macOS app would consume it.
      - name: Swift Core — Xcode
        working-directory: Spikes/CoreModel/swift
        run: xcodebuild test -scheme CoreModelSpike-Package -destination 'platform=macOS' -quiet

      - name: C++ Core and the host against both Cores
        run: |
          swift build --package-path swift -c release --product CompositorCore
          cmake -S . -B ../../build/spike -DSWIFT_CORE_DIR="$(swift build --package-path swift -c release --show-bin-path)"
          cmake --build ../../build/spike --config Release
          ctest --test-dir ../../build/spike --build-config Release --output-on-failure

      - name: Swift uses the C++ Core
        run: swift test --package-path cpp
